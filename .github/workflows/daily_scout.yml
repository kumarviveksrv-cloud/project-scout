name: Daily Scout

on:
  schedule:
    # 00:30 UTC = 06:00 IST (UTC+5:30), every other day.
    - cron: "30 0 */2 * *"
  # Lets you trigger a run manually from the Actions tab, e.g. to test the
  # workflow right after pushing instead of waiting for the schedule.
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # needed for actions/cache to write cache entries

concurrency:
  # Each run makes paid API calls - queue a second trigger rather than
  # canceling a run that's already spending money.
  group: daily-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    # Engine B fetches real company websites one lead at a time (10s timeout
    # each, on top of the search/extraction calls), and Contact Finder adds
    # its own per-company search+extraction pass on top of that.
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the dedup cache from a previous run (if it exists).
      # The cache file grows as new records are saved; it lives across runs
      # so engines never need to read from Airtable just to dedup.
      # Key is fixed so the same entry is always restored and overwritten.
      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: .known_keys_cache.json
          key: scout-dedup-cache
          restore-keys: scout-dedup-cache

      - name: Run Engine A - Opportunities
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: python scout.py --limit 50

      - name: Run Engine B - Company Intelligence
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANIES_TABLE_ID: ${{ secrets.AIRTABLE_COMPANIES_TABLE_ID }}
        run: python company_runner.py --limit 50

      - name: Run Engine C - Career Signal
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANIES_TABLE_ID: ${{ secrets.AIRTABLE_COMPANIES_TABLE_ID }}
          AIRTABLE_JOBLEADS_TABLE_ID: ${{ secrets.AIRTABLE_JOBLEADS_TABLE_ID }}
        run: python wellfound_runner.py --limit 50

      - name: Run Contact Finder
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANIES_TABLE_ID: ${{ secrets.AIRTABLE_COMPANIES_TABLE_ID }}
        run: python contact_finder.py

      # Save the updated dedup cache so the next run picks it up.
      # actions/cache@v4 with the same fixed key always saves on a cache miss
      # the first time, then updates in-place on subsequent runs.
      - name: Save dedup cache
        if: always()   # save even if an engine step failed (partial progress is still useful)
        uses: actions/cache@v4
        with:
          path: .known_keys_cache.json
          key: scout-dedup-cache

      - name: Send Daily Digest
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
          AIRTABLE_COMPANIES_TABLE_ID: ${{ secrets.AIRTABLE_COMPANIES_TABLE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: python digest.py
